databaseChangeLog:
  - changeSet:
      id: 007-add-submission-type
      author: system
      validCheckSum: ANY
      changes:
        - addColumn:
            tableName: payment_submissions
            columns:
              - column:
                  name: submission_type
                  type: varchar(20)
                  defaultValue: 'PORTAL'
                  constraints:
                    nullable: false
        - addColumn:
            tableName: payment_submissions
            columns:
              - column:
                  name: study_pack_id
                  type: uuid
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            constraintName: fk_submission_study_pack
            baseTableName: payment_submissions
            baseColumnNames: study_pack_id
            referencedTableName: study_packs
            referencedColumnNames: id
            onDelete: SET NULL
        - dropNotNullConstraint:
            tableName: payment_submissions
            columnName: portal_id
            columnDataType: uuid
